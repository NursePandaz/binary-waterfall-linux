name: Linux package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 python3-pyqt5.qtmultimedia python3-pydub python3-pil python3-yaml ffmpeg
      - run: sh packaging/linux/build-deb.sh
      - run: dpkg-deb -x dist/binary-waterfall_3.7.0-3_all.deb build/extracted
      - run: python3 packaging/linux/verify-payload.py build/extracted
      - run: QT_QPA_PLATFORM=offscreen PYTHONPATH=build/extracted/usr/share/binary-waterfall python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: binary-waterfall-linux
          path: dist/*.deb
